name: Release

on:
  push:
    tags: ['v*']
  # DRY RUN ONLY: builds an UNSIGNED release APK to prove the build works.
  # Never signs, never publishes a GitHub Release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Require signing secrets (tag builds only)
        if: env.IS_TAG == 'true'
        run: |
          for v in KEYSTORE_B64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing signing secret for $v. Add SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD (see docs/release.md). Refusing to publish an unsigned APK."
              exit 1
            fi
          done

      - name: Decode keystore (tag builds only)
        if: env.IS_TAG == 'true'
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Set version
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [ "$IS_TAG" = "true" ]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.0-dryrun" >> "$GITHUB_ENV"
          fi

      - run: ./gradlew assembleRelease

      - name: Verify signature (tag builds only)
        if: env.IS_TAG == 'true'
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "sleepsync-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "sleepsync-${GITHUB_REF_NAME}.apk" --title "$GITHUB_REF_NAME" --generate-notes

      - name: Upload unsigned dry-run APK
        if: env.IS_TAG != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dryrun-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
